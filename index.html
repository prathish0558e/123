    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #fff;
        background:

        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #boot-loader.bl-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .bl-wrap {
        position: relative;
        display: grid;
        justify-items: center;
        align-items: center;
        gap: 0;
        width: min(100%, 440px);
        padding: 18px 22px 26px;
        text-align: center;
      }
      .bl-brandline {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #f3e7d6;
        font: 700 10px/1.2 "Inter", system-ui, sans-serif;
        letter-spacing: 0.23em;
      }
      .bl-brandline::before,
      .bl-brandline::after {
        width: 24px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #c8996a);
        content: "";
      }
      .bl-brandline::after { transform: rotate(180deg); }
      .bl-stage {
        position: relative;
        display: grid;
        place-items: center;
        width: min(100%, 340px);
        height: 316px;
        margin: 12px 0 7px;
        perspective: 1200px;
      }
      .bl-halo {
        position: absolute;
        width: 282px;
        height: 282px;
        border: 1px dashed rgba(221, 189, 151, 0.3);
        border-radius: 50%;
        animation: bl-orbit 34s linear infinite;
      }
      .bl-halo::before,
      .bl-halo::after {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #dfa968;
        content: "";
      }
      .bl-halo::before { top: 47px; left: 21px; }
      .bl-halo::after { right: 18px; bottom: 58px; width: 4px; height: 4px; background: #f2d6ba; }
      .bl-halo-inner {
        position: absolute;
        width: 240px;
        height: 240px;
        border: 1px dotted rgba(133, 178, 237, 0.32);
        border-radius: 50%;
        animation: bl-orbit 25s linear infinite reverse;
      }
      .bl-floor {
        position: absolute;
        bottom: 11px;
        width: 182px;
        height: 24px;
        border-radius: 50%;
        background: rgba(2, 5, 15, 0.62);
        filter: blur(10px);
        animation: bl-shadow 3.8s ease-in-out infinite;
      }
      .bl-card {
        position: relative;
        z-index: 1;
        width: 190px;
        height: 260px;
        filter: drop-shadow(0 23px 24px rgba(0, 0, 0, 0.34));
      }
      .bl-flipper {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        animation: bl-flip 3.8s cubic-bezier(0.62, 0.04, 0.35, 0.98) infinite;
      }
      .bl-face {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        justify-items: center;
        padding: 15px 14px 12px;
        overflow: hidden;
        border: 1px solid rgba(234, 216, 191, 0.86);
        border-radius: 16px;
        color: #743f62;
        background:

          linear-gradient(150deg, #fffdf8, #f3e9dc);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .bl-face::before {
        position: absolute;
        inset: 8px;
        border: 1px dashed rgba(150, 111, 83, 0.45);
        border-radius: 10px;
        content: "";
        pointer-events: none;
      }
      .bl-face-back {
        color: #205c70;
        background:
          radial-gradient(circle at 18% 78%, rgba(137, 177, 176, 0.2), transparent 35%),
          linear-gradient(150deg, #fffdf8, #edf0e8);
        transform: rotateY(180deg);
      }
      .bl-card-brand {
        z-index: 1;
        color: #716453;
        font: 700 8px/1.2 "Inter", system-ui, sans-serif;
        letter-spacing: 0.19em;
      }

        width: 152px;
        height: 190px;
        align-self: center;
        overflow: visible;

      .bl-bar {

      @keyframes bl-flip {

        78%, 100% { transform: rotateY(360deg); }
      }
      @keyframes bl-orbit { to { transform: rotate(360deg); } }
      @keyframes bl-shadow {

      }
      @media (prefers-reduced-motion: reduce) {

        .bl-halo-inner,
        .bl-flipper,
        .bl-floor,
        .bl-bar span {
          animation: none;
        }
      }

    <script>
      /* Dismiss the entry animation: at least 1.5s so it can be seen, never
         longer than 2.6s so it can never hold the page hostage. */
      (function () {
        var el = document.getElementById("boot-loader");
        if (!el) return;
        var start = Date.now();
        var MIN = 1500;
        var MAX = 2600;
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          el.classList.add("bl-hide");
          window.setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 750);
        }
        function soon() {
          window.setTimeout(hide, Math.max(0, MIN - (Date.now() - start)));
        }
        if (document.readyState === "complete") soon();
        else window.addEventListener("load", soon);
        window.setTimeout(hide, MAX);
      })();
    </script>
