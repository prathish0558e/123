<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Logo transparency check</title>
    <style>
      body { margin: 0; font: 14px system-ui; display: flex; gap: 0; }
      .pane { flex: 1; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .dark { background: #0d1b2f; color: #fff; }
      .light { background: #f2f6ff; color: #111; }
      .row { display: flex; gap: 24px; align-items: center; }
      img { width: 200px; height: 200px; object-fit: contain; }
      .old { background: #fff; border: 1px dashed #888; }
      h3 { margin: 0; }
    </style>
  </head>
  <body>
    <div class="pane dark">
      <h3>NEW Logo.png (transparent)</h3>
      <img src="public/images/Logo.png" alt="new" />
    </div>
    <div class="pane light">
      <div class="row">
        <div style="text-align:center">
          <h3>NEW</h3>
          <img src="public/images/Logo.png" alt="new" />
        </div>
        <div style="text-align:center">
          <h3>OLD jpeg</h3>
          <div class="old"><img src="public/images/Logo.jpeg" alt="old" /></div>
        </div>
      </div>
    </div>
  </body>
</html>
