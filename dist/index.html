      .bl-bar span {

    <script>
      /* Dismiss the entry animation: at least 1.5s so it can be seen, never
         longer than 2.6s so it can never hold the page hostage. */
      (function () {
        var el = document.getElementById("boot-loader");
        if (!el) return;
        var start = Date.now();
        var MIN = 1500;
        var MAX = 2600;
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          el.classList.add("bl-hide");
          window.setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 750);
        }
        function soon() {
          window.setTimeout(hide, Math.max(0, MIN - (Date.now() - start)));
        }
        if (document.readyState === "complete") soon();
        else window.addEventListener("load", soon);
        window.setTimeout(hide, MAX);
      })();
    </script>
